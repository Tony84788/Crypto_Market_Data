name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python source
        run: |
          python -m compileall src

      - name: Run tests
        run: |
          pytest

  terraform-checks:
    name: Terraform checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check

      - name: Terraform initialize
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  dbt-checks:
    name: dbt checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: crypto_dbt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install "dbt==2.0.6"

      - name: Create CI dbt profile
        run: |
          mkdir -p "$RUNNER_TEMP/dbt"

          cat > "$RUNNER_TEMP/dbt/profiles.yml" <<'EOF'
          crypto_dbt:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: crypto-market-data-platform
                dataset: crypto_market
                threads: 1
                location: US
          EOF

      - name: Parse dbt project
        env:
          DBT_PROFILES_DIR: ${{ runner.temp }}/dbt
        run: |
          dbt parse
